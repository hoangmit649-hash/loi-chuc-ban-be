<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="manifest" href="manifest.json">
  <!-- Cho phép website hiển thị dạng ứng dụng -->
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Hiển thị toàn màn hình trên iPhone -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Tên ứng dụng -->
<meta name="apple-mobile-web-app-title" content="Lời Chúc Năm Mới">

<!-- Giao diện điện thoại -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chúc mừng năm mới</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 0;
    font-family: "Be Vietnam Pro", Arial, sans-serif;

    background: #750000;
    color: #3b0a0a;
    overflow-x: hidden;
    position: relative;
}

/* Video nền toàn website */
#videoNen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
}

/* Màn hình mở đầu nằm trên video */
.man-mo-dau {
    position: relative;
    width: 100%;
    min-height: 100vh;
    z-index: 2;
}

/* Các khung nội dung nằm trên video */
.card {
    position: relative;
    z-index: 2;
}

    .card {
      position: relative;
      z-index: 2;
      width: min(520px, 100%);
      background: #fffaf0;
      border-radius: 28px;
      padding: 36px 28px 32px;
      text-align: center;
      border: 4px solid #ffd23f;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
    }

    /* Khung video lớn */
.video-card {
    width: min(1100px, 96vw);
    max-width: 1100px;
    padding: 20px;
    border-radius: 20px;
}

/* Video hiển thị lớn */
.video-card video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 75vh;
    object-fit: contain;
    background: #000;
    border-radius: 15px;
}

/* Trên điện thoại */
@media (max-width: 600px) {
    .video-card {
        width: 96vw;
        padding: 10px;
    }

    .video-card video {
        max-height: 65vh;
    }
}

    .hidden { display: none; }
    .baoloi { color: #b3001b; background: #ffe9e9; border-radius: 14px; padding: 10px 14px; margin: 0 0 14px; font-size: .95rem; line-height: 1.5; }
    .emoji { font-size: 4rem; }
    h1 {
      font-family: "Baloo 2", sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      color: #b3001b;
      margin: 4px 0 8px;
      line-height: 1.15;
    }
    .nho { color: #6b4b4b; margin: 0 0 16px; }
    input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.05rem;
      text-align: center;
      border: 2px solid #e11d2e;
      border-radius: 999px;
      margin-bottom: 14px;
      font-family: inherit;
    }
    button {
      background: #e11d2e;
      color: white;
      border: 0;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: transform .2s, background .2s;
    }
    button:hover { background: #b3001b; transform: scale(1.06); }

    .loichuc {
      font-size: 1.2rem;
      line-height: 1.7;
      margin: 12px 0 0;
    }
    .ky { margin-top: 24px; font-weight: 600; color: #b3001b; }

    .nhom-nut { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
    .nhom-nut button { padding: 12px 22px; font-size: 1rem; }
    button.phu { background: transparent; color: #b3001b; border: 2px solid #b3001b; }
    button.phu:hover { background: #ffe9e9; }
    textarea {
      width: 100%; min-height: 110px; padding: 12px 16px; font-size: 1.05rem;
      border: 2px solid #e11d2e; border-radius: 18px; margin-bottom: 14px;
      font-family: inherit; resize: vertical;
    }

    .lac { display: inline-block; animation: lac 1.2s ease-in-out infinite; }
    @keyframes lac {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    .roi {
      position: fixed;
      top: -40px;
      z-index: 1;
      animation: roi linear forwards;
      pointer-events: none;
    }
    @keyframes roi { to { transform: translateY(110vh) rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .roi { display: none; } .lac { animation: none; } }

/* Nút bánh chưng */
.nut-banh-chung {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 145px;
    height: 145px;

    background: linear-gradient(145deg, #278b35, #07551e);
    border: 5px solid #e9d18b;
    border-radius: 22px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;

    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    cursor: pointer;
    animation: nhayBanhChung 1.5s infinite;
}

.banh-chung {
    font-size: 30px;
}

.chu-banh-chung {
    color: rgb(255, 253, 253);
    font-weight: 800;
    font-size: 20px;
     text-align: center;
}

@keyframes nhayBanhChung {
    0%, 100% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.08);
    }
}

.nut-banh-chung {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 180px;
    height: 180px;

    background: linear-gradient(145deg, #188b35, #07551e);
    border: 6px solid #f3df9c;
    border-radius: 30px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;

    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,.3);

    animation: nhayBanhChung 1.5s infinite;
}

.anh-banh-chung {
    width: 105px;
    height: 105px;
    object-fit: contain;
}

.chu-banh-chung {
    color: white;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
}

.chu-nen {
    font-size: 20px;
    color: white;
    position: absolute;
    top: 75%;
    left: 0;
    width: 100%;
    text-align: center;
}
#nutBanhChung {
    white-space: nowrap !important;
    text-align: center;
}
  </style>
</head>
<body>
  
<!-- VIDEO NỀN TOÀN WEBSITE -->
<video id="videoNen" autoplay loop playsinline>
    <source src="tiktok_video 5.mp4" type="video/mp4">
</video>


 <!-- MÀN HÌNH MỞ ĐẦU -->
<div id="man0" class="man-mo-dau">

    <button class="nut-banh-chung" id="nutBanhChung">
        <img src="banhchung.png"
         class="anh-banh-chung"
         alt="Bánh chưng">
        <span class="chu-banh-chung">BÁNH CHƯNG</span>
    </button>

</div>

<div id="bocbanhchung" class="hidden">
    🎊
</div>

  <!-- Màn hình 1: bao lì xì -->
  <div class="card hidden" id="man1">
    <div class="emoji lac">🧧</div>
    <h1>Chúc mừng năm mới!</h1>
    <p class="nho">Nhập đúng tên Facebook của bạn (không cần gõ dấu) rồi mở lì xì để nhận lời chúc riêng nhé.</p>
    <input id="ten" type="text" maxlength="30" placeholder="Tên Facebook của bạn" autocomplete="off">
    <p class="baoloi hidden" id="baoloi"></p>
    <button id="mo">Mở lì xì, Nhận lời chúc năm mới 🧧</button>
  </div>

  <!-- Màn hình 2: lời chúc -->
  <div class="card hidden" id="man2">
    <div class="emoji">🎉</div>
    <h1>Chúc mừng năm mới</h1>
    <p class="loichuc" id="loichuc"></p>
    <p class="ky" id="ky"></p>
    <div class="nhom-nut">
      <button id="nutGui">Gửi lời chúc tới Hoàng Mits</button>
      <button id="nutBoQua" class="phu">Bỏ qua</button>
    </div>
  </div>

 <!-- Màn hình 3: Gửi lời chúc tới Hoàng Mits -->
<div class="card hidden" id="man3">
    <div class="emoji">📩</div>
    <h1>Gửi đôi lời chúc năm mới tới Hoàng Mits</h1>
    <div id="formGui">
        <p class="nho">
            Viết vài dòng gửi lại cho Hoàng Mits nhé.
        </p>
        <textarea
            id="noiDung"
            maxlength="1000"
            placeholder="Nhập lời chúc của bạn..."
        ></textarea>
        <p class="baoloi hidden" id="baoloi3"></p>
        <div class="nhom-nut">
            <button id="nutGuiLoiChuc">Gửi lời chúc</button>
        </div>
    </div>
</div>

<!-- Màn hình 7: Lời cảm ơn -->
<div class="card hidden" id="man7">
  <div class="emoji">🙇‍♂️</div>
  <h1>Cảm ơn bạn! Happy NewYear </h1>
  <div class="nhom-nut">
    <button id="nutXemVideo">Xin Cảm Ơn!</button>
  </div>
</div>


  <!-- Màn hình 4: bỏ qua -->
  <div class="card hidden" id="man4">
    <div class="emoji">🧧</div>
    <h1>Happy NewYear!</h1>
    <div class="nhom-nut">
      <button class="phu" data-quay="man6">Xin Cảm Ơn!</button>
    </div>
  </div>

  <script src="loichuc.js"></script>
  <script src="danhsach.js"></script>
  <script src="loichuc_rieng.js"></script>
  <script>

    function hienLoiChuc() {
      const bao = document.getElementById("baoloi");
      try {
        xuLy();
      } catch (e) {
        bao.textContent = "Ôi bị lỗi mất tiu rồi: " + e.message + ".Xin lỗi vì sự trải nghiệm không mong muốn này!.";
        bao.classList.remove("hidden");
      }
    }

    function xuLy() {
      const ten = document.getElementById("ten").value.trim();
      const bao = document.getElementById("baoloi");

      if (!ten) {
        bao.textContent = "Bạn nhập tên Facebook của mình vào ô trên nhé.";
        bao.classList.remove("hidden");
        return;
      }
      // Mỗi người trong danh sách có sẵn một lời chúc riêng (quét lại vẫn ra đúng lời đó)
      const vitri = chiSoLoiChuc(ten);
const tenChuan = chuanHoaTen(ten);

// Kiểm tra người này có lời chúc riêng không
const coLoiChucRieng =
    Object.prototype.hasOwnProperty.call(LOI_CHUC_RIENG, tenChuan);

// Chỉ báo lỗi nếu không có trong danh sách VÀ cũng không có lời chúc riêng
if (vitri < 0 && !coLoiChucRieng) {
    bao.textContent = "Lời chúc này dành cho bạn bè và người theo dõi của Hoàng Mits.";
    bao.classList.remove("hidden");
    return;
}

bao.classList.add("hidden");
      bao.classList.add("hidden");

// Mặc định chưa có lời chúc riêng
let chuc = "";
// ƯU TIÊN 1: Kiểm tra lời chúc dành riêng cho người này
if (Object.prototype.hasOwnProperty.call(LOI_CHUC_RIENG, tenChuan)) {
    chuc = LOI_CHUC_RIENG[tenChuan];
}
if (!chuc) {
    chuc = LOI_CHUC[vitri % LOI_CHUC.length];
}
chuc = chuc.split("{ten}").join(ten);

document.getElementById("loichuc").textContent = chuc;
  const chuKy = CHU_KY_RIENG[tenChuan] || "Hoàng Mits";
document.getElementById("ky").textContent = "— " + chuKy;
      // Ẩn màn hình nhập tên
document.getElementById("man1").classList.add("hidden");
document.getElementById("man2").classList.remove("hidden");
    roiHoa();

    }

    function roiHoa() {
      const hoa = ["🌸", "🌼", "🧧", "✨"];
      for (let i = 0; i < 24; i++) {
        const s = document.createElement("span");
        s.className = "roi";
        s.textContent = hoa[i % hoa.length];
        s.style.left = Math.random() * 100 + "vw";
        s.style.fontSize = 16 + Math.random() * 18 + "px";
        s.style.animationDuration = 6 + Math.random() * 6 + "s";
        s.style.animationDelay = Math.random() * 4 + "s";
        document.body.appendChild(s);
      }
    }

    document.getElementById("mo").addEventListener("click", hienLoiChuc);
    // Bấm vào bánh trưng để mở ô nhập tên
document.getElementById("nutBanhChung").addEventListener("click", async () => {

    // 1. Lấy video nền
    const videoNen = document.getElementById("videoNen");

    // 2. Bật âm thanh
    videoNen.muted = false;
    videoNen.volume = 1;

    // 3. Phát video nền kèm tiếng
    try {
        await videoNen.play();
        console.log("Đã bật tiếng video nền!");
    } catch (error) {
        console.log("Không phát được tiếng:", error);
    }

    // 4. Chuyển sang màn hình nhập tên
    document.getElementById("man0").classList.add("hidden");

    document.getElementById("man1").classList.remove("hidden");

    document.getElementById("ten").focus();

});

    // Chuyển màn hình
    function hienMan(id) {
      ["man1", "man2", "man3", "man4", "man7"].forEach(m =>
        document.getElementById(m).classList.toggle("hidden", m !== id));
    }

    document.getElementById("nutGui").addEventListener("click", () => hienMan("man3"));
    document.getElementById("nutBoQua").addEventListener("click", () => hienMan("man4"));
   document.getElementById("nutGuiLoiChuc").addEventListener("click", () => hienMan("man7"));
    document.getElementById("nutXemVideo").addEventListener("click", () => hienMan("man5"));
    document.querySelectorAll("[data-quay]").forEach(b =>
      b.addEventListener("click", () => hienMan(b.dataset.quay)));

    document.getElementById("nutXacNhanGui").addEventListener("click", () => {
      const nd = document.getElementById("noiDung").value.trim();
      const bao = document.getElementById("baoloi3");
      if (!nd) {
        bao.textContent = "Bạn viết lời chúc vào ô trên nhé.";
        bao.classList.remove("hidden");
        return;
      }
      bao.classList.add("hidden");
      // TODO: gửi `nd` (kèm tên người gửi) lên server / Google Form tại đây
      document.getElementById("formGui").classList.add("hidden");
      document.getElementById("daGui").classList.remove("hidden");
    });
  </script>

  <script>
const videoNen = document.getElementById("videoNen");

// Cho video chạy tự động ở chế độ im lặng
videoNen.muted = true;
videoNen.volume = 1;

videoNen.play().catch(error => {
    console.log("Autoplay video bị chặn:", error);
});
</script>

</body>
</html>
